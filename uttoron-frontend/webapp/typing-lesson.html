<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Uttoron — Keyboard & Typing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & ROOT ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg: #050505;
            --bg-elev: #0b0b0c;
            --ink: #F5F1E6;
            --ink-dim: rgba(245, 241, 230, 0.62);
            --ink-faint: rgba(245, 241, 230, 0.36);
            --coral: #E6493C;
            --coral-soft: #FF6B57;
            --coral-glow: rgba(230, 73, 60, 0.45);
            --marigold: #E8A33D;
            --teal: #2E7D5B;
            --teal-glow: rgba(46, 125, 91, 0.4);
            --line: rgba(255, 255, 255, 0.09);
            --line-soft: rgba(255, 255, 255, 0.05);
            --glass: rgba(255, 255, 255, 0.035);
            --glass-strong: rgba(255, 255, 255, 0.065);
            --radius-lg: 22px;
            --radius-md: 16px;
            --radius-pill: 999px;
            --shadow-lg: 0 30px 70px rgba(0, 0, 0, 0.55);
            --font-display: 'Space Grotesk', sans-serif;
            --font-serif: 'Instrument Serif', serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            /* finger identity colors — one per finger, referenced by JS; keep distinct */
            --finger-lpinky: #FF6B6B;
            --finger-lring: #FF9F43;
            --finger-lmiddle: #FECA57;
            --finger-lindex: #54A0FF;
            --finger-rindex: #A29BFE;
            --finger-rmiddle: #1DD1A1;
            --finger-rring: #10AC84;
            --finger-rpinky: #FF9FF3;
            --finger-thumb: #b0a8a0;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-body);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }
        body.lite {
            --bg: #0d0d0d;
            --ink: #EDEAE0;
            --coral: #cf4133;
            --marigold: #c88a2e;
        }
        body.lite * {
            animation: none !important;
            transition: none !important;
            box-shadow: none !important;
        }
        .page-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse 60% 45% at 82% 0%, rgba(230, 73, 60, 0.14), transparent 60%),
                linear-gradient(180deg, #0d0505 0%, #050505 60%, #030202 100%);
        }
        h1,
        h2,
        h3,
        h4,
        .display {
            font-family: var(--font-display);
            letter-spacing: -0.01em;
        }
        .mono {
            font-family: var(--font-mono);
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        button {
            font-family: var(--font-body);
            cursor: pointer;
            border: none;
            background: none;
        }
        input,
        select,
        textarea {
            font-family: var(--font-body);
            font-size: 1rem;
        }
        :focus-visible {
            outline: 3px solid var(--marigold);
            outline-offset: 2px;
        }
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }
        .wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 16px 16px 0;
        }
        .nav-inner {
            max-width: 1080px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: rgba(9, 9, 10, 0.72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--line);
            border-radius: var(--radius-pill);
            padding: 9px 10px 9px 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 0.01em;
        }
        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--coral-soft), var(--marigold));
            color: #14100a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 0.85rem;
            flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(230, 73, 60, 0.35);
        }
        .back-link {
            background: linear-gradient(135deg, var(--coral-soft), var(--coral));
            border: none;
            color: #fff;
            padding: 8px 18px;
            border-radius: var(--radius-pill);
            font-size: 0.82rem;
            font-weight: 600;
            transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-link:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px var(--coral-glow);
            text-decoration: none;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 26px;
            border-radius: var(--radius-pill);
            font-weight: 600;
            font-size: 0.92rem;
            border: none;
            cursor: pointer;
            transition: transform 0.2s var(--ease), box-shadow 0.25s var(--ease), border-color 0.2s var(--ease), color 0.2s var(--ease);
            font-family: var(--font-body);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--coral-soft), var(--coral));
            color: #fff;
            box-shadow: 0 8px 24px rgba(230, 73, 60, 0.25);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px var(--coral-glow);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            color: var(--ink);
            border: 1.5px solid var(--line);
        }
        .btn-secondary:hover {
            border-color: var(--coral);
            color: var(--coral-soft);
            transform: translateY(-2px);
        }
        .btn-success {
            background: var(--teal);
            color: #fff;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--teal-glow);
        }
        .btn-sm {
            padding: 7px 16px;
            font-size: 0.8rem;
        }

        section {
            padding: 32px 0;
            position: relative;
            z-index: 1;
        }
        .lesson-shell {
            background: var(--bg-elev);
            color: var(--ink);
            border-radius: var(--radius-lg);
            padding: 28px;
            border: 1px solid var(--line);
            box-shadow: var(--shadow-lg);
        }
        .lesson-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            gap: 12px;
        }
        .lesson-top .tag {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--marigold);
        }
        .lesson-top h2 {
            margin: 4px 0 0;
            font-size: 1.3rem;
        }
        .close-x {
            background: none;
            border: none;
            font-size: 1.4rem;
            color: var(--ink-dim);
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.15s;
        }
        .close-x:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .lesson-progress {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 18px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--line);
            transition: background 0.3s;
        }
        .dot.active {
            background: var(--teal);
        }
        .dot.done {
            background: var(--teal);
            opacity: 0.5;
        }

        .scenario-card {
            background: var(--glass);
            border: 1.5px solid var(--line);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
        }

        /* ===== TYPING LESSON STYLES ===== */
        .typing-target {
            font-family: var(--font-mono);
            font-size: 1.2rem;
            line-height: 1.8;
            padding: 12px 16px;
            background: var(--bg-elev);
            border-radius: 8px;
            border: 1.5px solid var(--line);
            margin-bottom: 12px;
            letter-spacing: 1px;
            word-break: break-all;
        }
        .typing-target .char {
            transition: background 0.1s;
            padding: 2px 1px;
            border-radius: 2px;
        }
        .typing-target .char.correct {
            background: rgba(46, 125, 91, 0.28);
            color: #8fe0bb;
        }
        .typing-target .char.wrong {
            background: rgba(230, 73, 60, 0.24);
            color: var(--coral-soft);
        }
        .typing-target .char.current {
            background: rgba(232, 163, 61, 0.24);
            color: var(--ink);
            box-shadow: 0 0 0 2px var(--marigold);
        }
        .typing-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1.5px solid var(--line);
            font-family: var(--font-mono);
            font-size: 1.1rem;
            background: var(--bg-elev);
            color: var(--ink);
            letter-spacing: 1px;
        }
        .typing-input:focus {
            outline: none;
            border-color: var(--coral);
        }
        .typing-status {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--ink-dim);
            min-height: 1.5em;
        }
        .typing-status.good {
            color: var(--teal);
            font-weight: 600;
        }

        /* ===== FINGER PLACEMENT ===== */
        .finger-placement-area {
            background: var(--glass);
            border-radius: 14px;
            padding: 16px 12px 12px;
            margin-bottom: 14px;
            border: 1px solid var(--line);
        }
        .finger-placement-area .fp-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ink-dim);
            text-align: center;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .hand-wrapper {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-start;
        }
        .hand-svg-wrap {
            flex: 0 0 auto;
            max-width: 260px;
            width: 100%;
        }
        .hand-svg-wrap svg {
            width: 100%;
            height: auto;
            display: block;
        }
        .finger-label {
            font-size: 0.55rem;
            font-weight: 700;
            text-anchor: middle;
            dominant-baseline: central;
            fill: #1a1a1a;
            opacity: 0.8;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .finger-label.active {
            opacity: 1;
            fill: #000;
            font-weight: 800;
            font-size: 0.6rem;
        }
        .finger-shape {
            transition: all 0.25s ease;
            stroke-width: 2;
            stroke: var(--line);
            fill: var(--glass-strong);
            cursor: default;
        }
        .finger-shape.active {
            stroke-width: 3.5;
            stroke: var(--coral-soft);
            filter: drop-shadow(0 2px 6px rgba(230, 73, 60, 0.35));
        }
        .finger-shape.lpinky {
            fill: var(--finger-lpinky);
        }
        .finger-shape.lring {
            fill: var(--finger-lring);
        }
        .finger-shape.lmiddle {
            fill: var(--finger-lmiddle);
        }
        .finger-shape.lindex {
            fill: var(--finger-lindex);
        }
        .finger-shape.rindex {
            fill: var(--finger-rindex);
        }
        .finger-shape.rmiddle {
            fill: var(--finger-rmiddle);
        }
        .finger-shape.rring {
            fill: var(--finger-rring);
        }
        .finger-shape.rpinky {
            fill: var(--finger-rpinky);
        }
        .finger-shape.thumb {
            fill: var(--finger-thumb);
        }
        .hand-label {
            font-size: 0.6rem;
            font-weight: 600;
            fill: var(--ink-dim);
            text-anchor: middle;
            dominant-baseline: central;
            opacity: 0.7;
        }
        .finger-name-display {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--ink);
            padding: 6px 12px;
            background: var(--glass-strong);
            border-radius: 20px;
            display: inline-block;
            border: 1.5px solid var(--line);
            margin: 4px auto 0;
            min-width: 100px;
        }
        .finger-name-display .finger-color-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        /* ===== VIRTUAL KEYBOARD ===== */
        .keyboard {
            background: var(--bg-elev);
            border-radius: 12px;
            padding: 10px 8px 8px;
            margin-top: 14px;
            border: 1px solid var(--line);
            user-select: none;
            max-width: 100%;
            overflow-x: auto;
        }
        .key-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 4px;
        }
        .key {
            min-width: 32px;
            height: 36px;
            border-radius: 4px;
            background: var(--glass-strong);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--ink);
            transition: all 0.15s;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
            position: relative;
            cursor: default;
        }
        .key.special {
            min-width: 44px;
            font-size: 0.65rem;
            background: rgba(255, 255, 255, 0.04);
        }
        .key.space {
            min-width: 120px;
            background: rgba(255, 255, 255, 0.04);
        }
        .key.lpinky {
            border-bottom: 3px solid var(--finger-lpinky);
        }
        .key.lring {
            border-bottom: 3px solid var(--finger-lring);
        }
        .key.lmiddle {
            border-bottom: 3px solid var(--finger-lmiddle);
        }
        .key.lindex {
            border-bottom: 3px solid var(--finger-lindex);
        }
        .key.rindex {
            border-bottom: 3px solid var(--finger-rindex);
        }
        .key.rmiddle {
            border-bottom: 3px solid var(--finger-rmiddle);
        }
        .key.rring {
            border-bottom: 3px solid var(--finger-rring);
        }
        .key.rpinky {
            border-bottom: 3px solid var(--finger-rpinky);
        }
        .key.thumb {
            border-bottom: 3px solid var(--finger-thumb);
        }
        .key.highlight {
            border: 3px solid var(--coral);
            box-shadow: 0 0 16px var(--coral-glow);
            transform: scale(1.08);
            z-index: 2;
            position: relative;
        }
        .key.highlight::after {
            content: "👆";
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.2));
            animation: bounce-finger 0.8s ease-in-out infinite alternate;
        }
        @keyframes bounce-finger {
            0% {
                transform: translateX(-50%) translateY(0);
            }
            100% {
                transform: translateX(-50%) translateY(-4px);
            }
        }
        body.lite .key.highlight::after {
            animation: none;
        }
        .key .key-finger-tip {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-elev);
            color: var(--ink);
            border: 1px solid var(--line);
            font-size: 0.55rem;
            font-family: var(--font-body);
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 6px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 10;
        }
        .key:hover .key-finger-tip {
            opacity: 1;
        }
        .keyboard-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            justify-content: center;
            margin-top: 6px;
            font-size: 0.65rem;
            color: var(--ink-dim);
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: default;
        }
        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 1px solid var(--line);
        }

        .lesson-complete {
            text-align: center;
            padding: 16px 0;
        }
        .big-stamp {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            border: 2.5px solid var(--teal);
            color: var(--teal);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.75rem;
            flex-direction: column;
            transform: rotate(-6deg);
            background: rgba(46, 125, 91, 0.08);
            box-shadow: 0 0 0 3px rgba(46, 125, 91, 0.1), 0 0 18px rgba(46, 125, 91, 0.25);
            animation: stampPulse 3.4s ease-in-out infinite;
        }
        .big-stamp .stamp-icon {
            font-size: 1.6rem;
        }
        @keyframes stampPulse {
            0%, 100% { box-shadow: 0 0 0 3px rgba(46, 125, 91, 0.1), 0 0 14px rgba(46, 125, 91, 0.2); }
            50% { box-shadow: 0 0 0 3px rgba(46, 125, 91, 0.14), 0 0 22px rgba(46, 125, 91, 0.35); }
        }

        footer {
            padding: 32px 0 44px;
            border-top: 1px solid var(--line);
            color: var(--ink-dim);
            font-size: 0.78rem;
            position: relative;
            z-index: 1;
        }
        footer .wrap {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-elev);
            color: var(--ink);
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 0.85rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
            border: 1px solid var(--line);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        .toast.success {
            border-color: var(--teal);
        }
        .toast.error {
            border-color: var(--coral);
        }

        @media (max-width: 500px) {
            .key {
                min-width: 24px;
                height: 28px;
                font-size: 0.6rem;
            }
            .key.special {
                min-width: 32px;
                font-size: 0.55rem;
            }
            .key.space {
                min-width: 60px;
            }
            .keyboard {
                padding: 6px 4px;
            }
            .key-row {
                gap: 2px;
                margin-bottom: 2px;
            }
            .hand-svg-wrap {
                max-width: 180px;
            }
            .finger-name-display {
                font-size: 0.7rem;
                min-width: 70px;
                padding: 4px 10px;
            }
            .typing-target {
                font-size: 1rem;
            }
            .key.highlight::after {
                font-size: 0.5rem;
                top: -14px;
            }
        }
    </style>
</head>
<body>
    <div class="page-bg" aria-hidden="true"></div>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast"></div>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="nav-inner">
            <div class="brand">
                <span class="brand-mark">উ</span>
                Uttoron
            </div>
            <a href="index1.html" class="back-link">← Back to Home</a>
        </div>
    </nav>

    <!-- ===== LESSON ===== -->
    <section>
        <div class="wrap">
            <div class="lesson-shell" id="lessonShell"></div>
        </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer>
        <div class="wrap">
            <span>Uttoron — Skills Passport</span>
            <span>Keyboard & Typing · Interactive Lesson</span>
        </div>
    </footer>

    <script src="../shared/apiConfig.js"></script>
    <script src="../shared/backendBridge.js"></script>
    <script src="typingResultStore.js"></script>
    <script>
        (function() {
            "use strict";

            // ============================================================
            //  TYPING SESSIONS — Month 1 of both grade bands in the
            //  Uttoron Vocational Skills Curriculum. The codebase has no
            //  `grade` field anywhere (see the build-log spec), so which
            //  band a student sees is a purely client-side choice (§ grade
            //  band picker, below) — checkpointIds are just namespaced
            //  'g69'/'g45' so a reviewer can tell them apart in the queue.
            //
            //  Grade 6-9 — "Typing Fluency & File Management": Sessions 4
            //  and 6 are file-management-only in the curriculum (nested
            //  folders, renaming/searching real files) — not reproduced
            //  here as a typing exercise; that work belongs on the

            // ============================================================
            //  TYPING FEEDBACK INSTRUMENTATION (typing feedback spec §5)
            //
            //  Per-phrase timing/accuracy, aggregated into one checkpoint
            //  result for the whole 4-phrase lesson (spec §5: a single
            //  8-word phrase's WPM is too noisy to be a meaningful unit to
            //  review on its own — one checkpoint = the full attempt).
            // ============================================================
            let phraseStartTime = null;
            let phraseKeystrokes = 0;
            let phraseErrors = 0;
            let checkpointResults = []; // one computeResult() output per completed phrase
            let checkpointSubmitted = false;

            function startAttempt() {
                phraseStartTime = Date.now();
                phraseKeystrokes = 0;
                phraseErrors = 0;
            }

            function computeResult(targetText) {
                const elapsedSeconds = (Date.now() - phraseStartTime) / 1000;
                const wpm = elapsedSeconds > 0 ? (targetText.length / 5) / (elapsedSeconds / 60) : 0;
                const accuracy = phraseKeystrokes > 0
                    ? Math.max(0, ((phraseKeystrokes - phraseErrors) / phraseKeystrokes) * 100)
                    : 100;
                return {
                    wpm: Math.round(wpm * 10) / 10,
                    accuracy: Math.round(accuracy * 10) / 10,
                    errorCount: phraseErrors,
                    durationSeconds: Math.round(elapsedSeconds * 10) / 10,
                    textLength: targetText.length,
                    // Raw keystrokes, kept only for combining phrases below —
                    // not part of the shape sent to the backend. Combining
                    // per-phrase *accuracy percentages* by averaging them
                    // would weight a short phrase the same as a long one;
                    // recombining from raw keystrokes/errors keeps the
                    // checkpoint's accuracy a true keystroke-weighted figure.
                    keystrokes: phraseKeystrokes
                };
            }

            // Combines every phrase's result into one checkpoint result:
            // durations and text lengths sum (this is genuine typing time,
            // with the idle "reading the next phrase" gap between phrases
            // excluded since each phrase's timer only starts on its first
            // keystroke); accuracy is recomputed from summed keystrokes/
            // errors rather than averaged, for the reason above.
            function combineCheckpointResults(results) {
                const durationSeconds = Math.round(results.reduce((s, r) => s + r.durationSeconds, 0) * 10) / 10;
                const textLength = results.reduce((s, r) => s + r.textLength, 0);
                const errorCount = results.reduce((s, r) => s + r.errorCount, 0);
                const keystrokes = results.reduce((s, r) => s + r.keystrokes, 0);
                const accuracy = keystrokes > 0
                    ? Math.round(Math.max(0, ((keystrokes - errorCount) / keystrokes) * 100) * 10) / 10
                    : 100;
                const wpm = durationSeconds > 0
                    ? Math.round(((textLength / 5) / (durationSeconds / 60)) * 10) / 10
                    : 0;
                return { wpm, accuracy, errorCount, durationSeconds, textLength };
            }

            async function submitCheckpointToBackend(checkpointId) {
                if (checkpointSubmitted || checkpointResults.length === 0) return null;

                const session = getStorage('uttoron:session');
                if (!session || !session.num) return null; // saveProgress() already prompted to sign in

                if (!localUser) return null;

                    const backendUid = await TypingStore.identify({ num: session.num, nickname: localUser.nickname }, Storage);
                    if (!backendUid) return null;
                    const combined = combineCheckpointResults(checkpointResults);
                    await TypingStore.submitTypingResult({ backendUid, checkpointId, ...combined });
                    return { backendUid, combined };

                    console.error('Could not submit typing checkpoint result:', err);
                    return null;
                }
            }

                    const extra = f.transform || '';
                    svg +=
                        `<rect x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" rx="${f.rx}" class="finger-shape ${f.id} ${active ? 'active' : ''}"${extra} />`;
                    const lx = f.x + f.w / 2;
                    const ly = f.y + f.h / 2 + 2;
                    const label = f.id === 'thumb' ? 'Thumb' : f.label;
                    svg +=
                        `<text x="${lx}" y="${ly}" class="finger-label ${active ? 'active' : ''}" font-size="${f.id === 'thumb' ? 6 : 7}">${label}</text>`;
                };
                leftFingers.forEach(f => drawFinger(f, 'left'));
                rightFingers.forEach(f => drawFinger(f, 'right'));
                svg += `</svg>`;
                return svg;
            }

            // ============================================================

            // ============================================================
            //  TYPING LESSON RENDERER
            // ============================================================
            function renderTypingLesson() {
                if (!currentGradeBand) { renderGradeBandPicker(); return; }
                if (!currentSessionId) { renderSessionPicker(); return; }
                const data = SESSIONS_BY_ID[currentSessionId];
                if (!data) { renderSessionPicker(); return; }
                const phrases = data.phrases;
                const total = phrases.length;
                const shell = $('#lessonShell');

                if (currentItemIndex >= total) {
                    // Lesson complete!
                    if (!lessonCompleted) {
                        lessonCompleted = true;
                        // Save progress
                        saveProgress();
                        markSessionCompleted(data.id);
                        // Submit the combined checkpoint result to the backend (Phase 2),
                        // then render the completion screen once that settles (it never
                        // blocks the local stamp above, but Session 8's baseline
                        // comparison needs the backend round trip to finish first).
                        submitCheckpointToBackend(data.checkpointId).then(submitOutcome => {
                            showCompletionScreen(data, submitOutcome);
                        });
                        return;
                    }
                    showCompletionScreen(data, null);
                    return;
                }

                const target = phrases[currentItemIndex];
                let dotsHtml = '<div class="lesson-progress">';
                for (let i = 0; i < total; i++) {
                    const cls = i < currentItemIndex ? 'dot done' : i === currentItemIndex ? 'dot active' : 'dot';
                    dotsHtml += `<span class="${cls}"></span>`;
                }
                dotsHtml += '</div>';

                let targetHtml = target.split('').map(ch => `<span class="char">${ch}</span>`).join('');
                const keyboardHtml = buildKeyboardHTML();
                const handSvg = buildHandSVG(null);

                shell.innerHTML = `
                    <div class="lesson-top">
                        <div>
                            <span class="tag">Session ${data.number} · ${data.title}</span>
                            <h2>${data.objective}</h2>
                            <button class="btn btn-secondary btn-sm" id="backToSessionsBtn" style="margin-top:8px;">← All sessions</button>
                        </div>
                    </div>
                    ${dotsHtml}
                    <div class="scenario-card">
                        <div class="typing-target">${targetHtml}</div>
                        <input type="text" id="typingInput" class="typing-input" placeholder="Type the text above..." autofocus>
                        <div id="typingStatus" class="typing-status">Start typing above...</div>
                        <div class="finger-placement-area">
                            <div class="fp-title">👆 Finger Placement — use the correct finger for each key</div>
                            <div class="hand-wrapper">
                                <div class="hand-svg-wrap" id="handDiagram">${handSvg}</div>
                                <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:100px;">
                                    <div class="finger-name-display" id="fingerNameDisplay">
                                        <span class="finger-color-dot" style="background:#b0a8a0;"></span>
                                        <span id="fingerNameText">Place fingers on home row</span>
                                    </div>
                                    <div style="font-size:0.7rem;color:var(--ink-dim);text-align:center;max-width:180px;">
                                        The highlighted key shows which finger to use.
                                        Hover any key to see its finger.
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="keyboard" id="virtualKeyboard">
                            ${keyboardHtml}
                            <div class="keyboard-legend">
                                <span class="legend-item"><span class="legend-color" style="background:#FF6B6B;"></span> L. Pinky</span>
                                <span class="legend-item"><span class="legend-color" style="background:#FF9F43;"></span> L. Ring</span>
                                <span class="legend-item"><span class="legend-color" style="background:#FECA57;"></span> L. Middle</span>
                                <span class="legend-item"><span class="legend-color" style="background:#54A0FF;"></span> L. Index</span>
                                <span class="legend-item"><span class="legend-color" style="background:#A29BFE;"></span> R. Index</span>
                                <span class="legend-item"><span class="legend-color" style="background:#1DD1A1;"></span> R. Middle</span>
                                <span class="legend-item"><span class="legend-color" style="background:#10AC84;"></span> R. Ring</span>
                                <span class="legend-item"><span class="legend-color" style="background:#FF9FF3;"></span> R. Pinky</span>
                                <span class="legend-item"><span class="legend-color" style="background:#b0a8a0;"></span> Thumb</span>
                            </div>
                        </div>
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;flex-wrap:wrap;gap:8px;">
                        <span style="font-size:0.78rem;color:var(--ink-dim);">${currentItemIndex+1} of ${total}</span>
                        <button class="btn btn-primary btn-sm" id="typingNext" disabled>${currentItemIndex === total-1 ? 'Finish' : 'Next'}</button>
                    </div>
                `;

                const input = $('#typingInput');
                const status = $('#typingStatus');
                const nextBtn = $('#typingNext');
                const fingerNameText = $('#fingerNameText');
                const fingerNameDisplay = $('#fingerNameDisplay');
                const handDiagram = $('#handDiagram');

                input.focus();

                const fingerNames = {
                    'lpinky': 'Left Pinky',
                    'lring': 'Left Ring',
                    'lmiddle': 'Left Middle',
                    'lindex': 'Left Index',
                    'rindex': 'Right Index',
                    'rmiddle': 'Right Middle',
                    'rring': 'Right Ring',
                    'rpinky': 'Right Pinky',
                    'thumb': 'Thumb'
                };
                const fingerColors = {
                    'lpinky': '#FF6B6B',
                    'lring': '#FF9F43',
                    'lmiddle': '#FECA57',
                    'lindex': '#54A0FF',
                    'rindex': '#A29BFE',
                    'rmiddle': '#1DD1A1',
                    'rring': '#10AC84',
                    'rpinky': '#FF9FF3',
                    'thumb': '#b0a8a0'
                };

                function getFingerForChar(ch) {
                    const map = {
                        '`': 'lpinky',
                        '1': 'lpinky',
                        'q': 'lpinky',
                        'a': 'lpinky',
                        'z': 'lpinky',
                        '2': 'lring',
                        'w': 'lring',
                        's': 'lring',
                        'x': 'lring',
                        '3': 'lmiddle',
                        'e': 'lmiddle',
                        'd': 'lmiddle',
                        'c': 'lmiddle',
                        '4': 'lindex',
                        '5': 'lindex',
                        'r': 'lindex',
                        't': 'lindex',
                        'f': 'lindex',
                        'g': 'lindex',
                        'v': 'lindex',
                        'b': 'lindex',
                        '6': 'rindex',
                        '7': 'rindex',
                        'y': 'rindex',
                        'u': 'rindex',
                        'h': 'rindex',
                        'j': 'rindex',
                        'n': 'rindex',
                        'm': 'rindex',
                        '8': 'rmiddle',
                        'i': 'rmiddle',
                        'k': 'rmiddle',
                        ',': 'rmiddle',
                        '9': 'rring',
                        'o': 'rring',
                        'l': 'rring',
                        '.': 'rring',
                        '0': 'rpinky',
                        'p': 'rpinky',
                        ';': 'rpinky',
                        "'": 'rpinky',
                        '/': 'rpinky',
                        '-': 'rpinky',
                        '=': 'rpinky',
                        '[': 'rpinky',
                        ']': 'rpinky',
                        '\\': 'rpinky',
                        ' ': 'thumb',
                        'tab': 'lpinky',
                        'capslock': 'lpinky',
                        'shift': 'lpinky',
                        'ctrl': 'thumb',
                        'alt': 'thumb',
                        'enter': 'rpinky',
                        'backspace': 'rpinky'
                    };
                    const lower = ch.toLowerCase();
                    return map[lower] || map[ch] || 'thumb';
                }

                function updateFingerDisplay(fingerId) {
                    if (fingerId && fingerNames[fingerId]) {
                        const name = fingerNames[fingerId];
                        const color = fingerColors[fingerId] || '#b0a8a0';
                        fingerNameText.textContent = name;
                        const dot = fingerNameDisplay.querySelector('.finger-color-dot');
                        if (dot) dot.style.background = color;
                        const newHandSvg = buildHandSVG(fingerId);
                        handDiagram.innerHTML = newHandSvg;
                    } else {
                        fingerNameText.textContent = 'Place fingers on home row';
                        const dot = fingerNameDisplay.querySelector('.finger-color-dot');
                        if (dot) dot.style.background = '#b0a8a0';
                        const newHandSvg = buildHandSVG(null);
                        handDiagram.innerHTML = newHandSvg;
                    }
                }

                function highlightNextKey() {
                    document.querySelectorAll('.key.highlight').forEach(el => el.classList.remove('highlight'));
                    const typed = input.value;
                    if (typed.length < target.length) {
                        const nextChar = target[typed.length];
                        const keyEl = document.querySelector(`.key[data-key="${nextChar}"]`);
                        if (keyEl) {
                            keyEl.classList.add('highlight');
                            const finger = keyEl.dataset.finger || getFingerForChar(nextChar);
                            updateFingerDisplay(finger);
                        } else {
                            const upper = nextChar.toUpperCase();
                            const keyEl2 = document.querySelector(`.key[data-key="${upper}"]`);
                            if (keyEl2) {
                                keyEl2.classList.add('highlight');
                                const finger = keyEl2.dataset.finger || getFingerForChar(nextChar);
                                updateFingerDisplay(finger);
                            } else {
                                const finger = getFingerForChar(nextChar);
                                updateFingerDisplay(finger);
                            }
                        }
                    } else {
                        updateFingerDisplay(null);
                    }
                }

                highlightNextKey();

                // Typing feedback instrumentation, scoped to this phrase
                // (fresh on every call to renderTypingLesson(), i.e. every
                // phrase) — spec §5.
                let phraseTimerStarted = false;
                let prevTypedLen = 0;
                let phraseResultRecorded = false;

                input.addEventListener('input', function() {
                    const typed = this.value;

                    // A student reading the phrase before typing shouldn't
                    // count against their time — start the clock on the
                    // first keystroke of this phrase, not on page load.
                    if (!phraseTimerStarted) { phraseTimerStarted = true; startAttempt(); }
                    // Only a newly-appended character is a "keystroke" for
                    // WPM/accuracy purposes — a backspace shouldn't count as
                    // an error, and re-typing after a correction shouldn't
                    // double-count the position.
                    if (typed.length > prevTypedLen) {
                        const idx = typed.length - 1;
                        phraseKeystrokes++;
                        if (typed[idx] !== target[idx]) phraseErrors++;
                    }
                    prevTypedLen = typed.length;

                    const chars = document.querySelectorAll('.typing-target .char');
                    let allCorrect = true;
                    for (let i = 0; i < chars.length; i++) {
                        const ch = chars[i];
                        if (i < typed.length && i < target.length) {
                            if (typed[i] === target[i]) {
                                ch.className = 'char correct';
                            } else {
                                ch.className = 'char wrong';
                                allCorrect = false;
                            }
                        } else {
                            ch.className = 'char';
                            allCorrect = false;
                        }
                    }
                    if (typed.length < target.length) {
                        const currentChar = chars[typed.length];
                        if (currentChar) currentChar.className = 'char current';
                    }
                    highlightNextKey();
                    if (typed.length === target.length && allCorrect) {
                        status.textContent = '✅ Perfect! Click Next to continue.';
                        status.className = 'typing-status good';
                        nextBtn.disabled = false;
                        updateFingerDisplay(null);
                        // "Attempt complete" for this phrase — record it once;
                        // further edits after a perfect completion (backspacing
                        // to tinker) don't re-record a second result for the
                        // same phrase.
                        if (!phraseResultRecorded) {
                            phraseResultRecorded = true;
                            checkpointResults.push(computeResult(target));
                        }
                    } else {
                        if (typed.length === 0) {
                            status.textContent = 'Start typing...';
                        } else if (typed.length > target.length) {
                            status.textContent = '⚠️ Too many characters. Backspace to match the target.';
                        } else if (typed.length > 0 && !allCorrect) {
                            status.textContent = '⚠️ Some characters are wrong. Backspace and correct them.';
                        } else {
                            status.textContent = 'Keep going...';
                        }
                        status.className = 'typing-status';
                        nextBtn.disabled = true;
                    }
                });

                input.addEventListener('paste', (e) => e.preventDefault());

                document.querySelectorAll('.key').forEach(keyEl => {
                    keyEl.addEventListener('click', function() {
                        const key = this.dataset.key;
                        if (key === 'backspace') {
                            const val = input.value;
                            input.value = val.slice(0, -1);
                        } else if (key === 'space' || key === ' ') {
                            input.value += ' ';
                        } else if (key === 'enter' || key === 'tab' || key === 'capslock' || key === 'shift' ||
                            key === 'ctrl' || key === 'alt') {
                            // ignore
                        } else {
                            input.value += key;
                        }
                        input.dispatchEvent(new Event('input'));
                        input.focus();
                    });
                });

                setTimeout(() => {
                    const chars = document.querySelectorAll('.typing-target .char');
                    if (chars.length > 0) chars[0].className = 'char current';
                    highlightNextKey();
                }, 50);

                nextBtn.addEventListener('click', function() {
                    if (this.disabled) return;
                    currentItemIndex++;
                    renderTypingLesson();
                });

                const backBtn = $('#backToSessionsBtn');
                if (backBtn) backBtn.addEventListener('click', function() {
                    currentSessionId = null;
                    renderSessionPicker();
                });
            }

            // ============================================================
            //  COMPLETION
            // ============================================================
            async function showCompletionScreen(session, submitOutcome) {
                const shell = $('#lessonShell');
                const bandSessions = GRADE_BANDS[currentGradeBand].sessions;
                const idx = bandSessions.findIndex(s => s.id === session.id);
                const next = bandSessions[idx + 1] || null;
                const baselineSession = bandSessions.find(s => s.isBaseline);

                // Final session only: pull the student's own baseline result
                // for this grade band (via TypingStore.listMine — no reviewer
                // tag required, unlike getComparisons) and show the delta
                // right here. This is the
                // curriculum's own Session 8 assessment instruction ("compare
                // to your Session 1 baseline") surfaced directly on the page.
                let comparisonHtml = '';
                if (session.isFinal && submitOutcome && submitOutcome.backendUid && baselineSession) {
                    try {
                        const baselineRows = await TypingStore.listMine(submitOutcome.backendUid, baselineSession.checkpointId);
                        if (baselineRows && baselineRows.length > 0) {
                            const baseline = baselineRows[baselineRows.length - 1].result; // oldest baseline attempt
                            const wpmDelta = Math.round((submitOutcome.combined.wpm - baseline.wpm) * 10) / 10;
                            const accDelta = Math.round((submitOutcome.combined.accuracy - baseline.accuracy) * 10) / 10;
                            const arrow = (d) => d > 0 ? '↑' : d < 0 ? '↓' : '→';
                            comparisonHtml = `
                                <div class="scenario-card" style="text-align:left;margin:18px 0;">
                                    <div class="fp-title" style="text-align:left;margin-bottom:10px;">Session ${baselineSession.number} baseline → today</div>
                                    <div style="display:flex;gap:24px;flex-wrap:wrap;font-family:var(--font-mono);">
                                        <div><div style="font-size:0.7rem;color:var(--ink-faint);">WPM</div><div style="font-size:1.3rem;">${baseline.wpm} → ${submitOutcome.combined.wpm} <span style="color:${wpmDelta >= 0 ? 'var(--teal)' : 'var(--coral-soft)'};font-size:0.9rem;">(${arrow(wpmDelta)}${Math.abs(wpmDelta)})</span></div></div>
                                        <div><div style="font-size:0.7rem;color:var(--ink-faint);">Accuracy</div><div style="font-size:1.3rem;">${baseline.accuracy}% → ${submitOutcome.combined.accuracy}% <span style="color:${accDelta >= 0 ? 'var(--teal)' : 'var(--coral-soft)'};font-size:0.9rem;">(${arrow(accDelta)}${Math.abs(accDelta)})</span></div></div>
                                    </div>
                                </div>
                            `;
                        }
                    } catch (err) {
                        console.error('Could not load baseline comparison:', err);
                    }
                }

                shell.innerHTML = `
                    <div class="lesson-complete">
                        <div class="big-stamp">
                            <span class="stamp-icon">⌨️</span>
                            ✓
                        </div>
                        <h2>🎯 Session ${session.number} complete!</h2>
                        <p style="color:var(--ink-dim);">${session.title}</p>
                        <p style="color:var(--teal);font-weight:600;margin-top:8px;">✅ Sent to your reviewer — check back on your Passport for feedback.</p>
                        ${comparisonHtml}
                        <div style="display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap;">
                            ${next ? `<button class="btn btn-primary" id="nextSessionBtn">Session ${next.number}: ${next.title} →</button>` : ''}
                            <button class="btn btn-secondary" id="allSessionsBtn">All sessions</button>
                            <button class="btn btn-secondary" id="resetLessonBtn">🔄 Redo this session</button>
                            <a href="index1.html" class="btn btn-secondary">Back to Home</a>
                        </div>
                    </div>
                `;
                if (next) {
                    document.getElementById('nextSessionBtn').addEventListener('click', function() {
                        currentSessionId = next.id;
                        currentItemIndex = 0;
                        lessonCompleted = false;
                        checkpointResults = [];
                        checkpointSubmitted = false;
                        renderTypingLesson();
                    });
                }
                document.getElementById('allSessionsBtn').addEventListener('click', function() {
                    currentSessionId = null;
                    renderSessionPicker();
                });
                document.getElementById('resetLessonBtn').addEventListener('click', function() {
                    currentItemIndex = 0;
                    lessonCompleted = false;
                    // A redo is a new, separately dated checkpoint attempt
                    // (spec §6, option b) — not a continuation of the one
                    // just submitted.
                    checkpointResults = [];
                    checkpointSubmitted = false;
                    renderTypingLesson();
                });
            }

            // ============================================================
            //  CHECK IF ALREADY COMPLETED
            // ============================================================
            function checkProgress() {
                const session = getStorage('uttoron:session');
                if (session && session.num) {
                    const progress = getStorage('progress:' + session.num);
                    if (progress && progress.typing === true) {
                        // Already completed, but we'll let them practice again
                        // They can still re-do the lesson
                    }
                }
            }

            // ============================================================
            //  INIT
            // ============================================================
            function init() {
                checkProgress();
                const saved = getSavedGradeBand();
                if (saved && GRADE_BANDS[saved]) currentGradeBand = saved;
                renderTypingLesson();
            }

            init();

        })();
    </script>

</body>
</html>
